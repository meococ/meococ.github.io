[package]
name = "meogen"
version = "0.1.0"
edition = "2021"
description = "The tiny static site generator behind meococ.github.io"
license = "MIT"
publish = false

[dependencies]
pulldown-cmark = { version = "0.12", default-features = false, features = ["html"] }
serde = { version = "1", features = ["derive"] }
tera = "1"
toml = "0.8"
walkdir = "2"
