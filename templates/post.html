{% extends "base.html" %}

{% block main %}
<main id="main">
<div class="wrap">
  <section class="post-hero">
    <a class="back" href="{{ back_href | safe }}">← {{ back_label }}</a>
    <div class="eyebrow rv">{{ kicker }}</div>
    <h1 class="rv" style="--d:.08s;">{{ title_h1 }}</h1>
    <div class="post-meta rv" style="--d:.16s;"><span><em>{{ date }}</em></span><span>{{ minutes }}</span><span>{{ tag }}</span></div>
  </section>
</div>
<div class="post-body">
  <div class="wrap">
    <div class="prose">

{{ body | safe }}

    </div>
    <nav class="post-nav" aria-label="Bài viết khác">
      {% for n in nav %}<a href="{{ n.href | safe }}"><b>{{ n.label }}</b><span class="t">{{ n.title }}</span></a>
      {% endfor %}
    </nav>
  </div>
</div>
</main>
{% endblock %}
